[project]
name = "overnex-demo"
version = "0.1.0"
description = "Gera os dados fictícios da Distribuidora Overnex (empresa de demonstração) e os envia ao Storage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # base de fusos horários: o Windows não traz a do sistema (ZoneInfo("America/Fortaleza"))
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pyarrow-stubs>=17",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "PT", "C4", "RET"]
# RUF001-003: o código é em português; acentos não são caracteres ambíguos aqui.
# S311: o sorteio é para dados fictícios, não para segurança.
ignore = ["RUF001", "RUF002", "RUF003", "N818", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["demo", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
