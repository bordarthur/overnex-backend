[project]
name = "overnex-api"
version = "0.1.0"
description = "API do Overnex: devolve o JSON de cada tela pronto para o front."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.9",
    "holidays>=0.106",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "PT", "C4", "RET"]
# RUF001-003: o código é em português; acentos não são caracteres ambíguos aqui.
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends", "fastapi.params.Query"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Starlette passou a preferir httpx2 no TestClient; httpx segue funcionando.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:UserWarning"]
markers = [
    "db: precisa do banco local (supabase start + supabase db reset)",
]
