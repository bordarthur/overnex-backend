# CI do back: formatação, lint, tipos e testes sem banco da API e da carga, a cada push em
# main/dev e a cada PR. Os jobs "api" e "carga" são os checks obrigatórios dos rulesets.
# Os testes com banco (marcas db e integracao) ainda ficam de fora: precisam do Supabase
# local (supabase start + supabase db reset). Ver TODO.md, "Validar com Docker".
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Um push novo na mesma branch cancela a verificação anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -m "not db"

  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobs/carga
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: jobs/carga/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not integracao"
